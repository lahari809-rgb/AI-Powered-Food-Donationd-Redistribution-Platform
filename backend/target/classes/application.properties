# Application
spring.application.name=FreshConnect
server.port=8080

# ====================================================================
# DATABASE CONFIGURATION
# ====================================================================

# --- Option 1: H2 In-Memory DB (Active by Default - Zero Setup) ---
spring.datasource.url=jdbc:h2:mem:freshconnectdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Option 2: MySQL Database (Uncomment below to use real MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/freshconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
